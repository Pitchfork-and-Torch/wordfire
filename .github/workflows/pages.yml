name: pages

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Use npm 11 (matches packageManager / local lockfile)
        run: npm install -g npm@11.16.0
      - run: npm ci
      - name: Build
        env:
          NITRO_PRESET: cloudflare_pages
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 75c71da18eeb801b3408c812742d6590
          command: pages deploy dist --project-name=wordfire-jonbailey
